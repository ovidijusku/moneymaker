[project]
name = "moneymaker"
version = "0.1.0"
description = "Advisory-first crypto trading signal platform"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiosqlite>=0.20",
    "alembic>=1.13",
    "alpaca-py>=0.30",
    "apscheduler>=3.10",
    "feedparser>=6.0",
    "httpx>=0.27",
    "praw>=7.7",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy[asyncio]>=2.0",
    "structlog>=24.4",
    "talipp>=2.0",
    "tenacity>=9.0",
]

# Heavy optional stacks: kept out of the default install so Phase 0 stays fast.
[project.optional-dependencies]
sentiment = ["torch>=2.4", "transformers>=4.44"]
backtest = ["pandas>=2.2", "vectorbt>=0.26"]

[dependency-groups]
dev = [
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/moneymaker"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
target-version = "py312"

[tool.ruff.lint]
select = [
    "A",   # builtin shadowing
    "ARG", # unused arguments
    "B",   # bugbear
    "C4",  # comprehensions
    "DTZ", # naive datetimes
    "E",
    "F",
    "I",   # import sorting
    "N",   # naming
    "PT",  # pytest style
    "RET", # return simplification
    "RUF",
    "S",   # bandit security
    "SIM",
    "TID",
    "UP",
    "W",
]
ignore = ["A003"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"] # asserts are the point in tests
# SQLAlchemy dictates the TypeDecorator override signature, `dialect` included.
"src/moneymaker/persistence/types.py" = ["ARG002"]

[tool.ruff.lint.isort]
known-first-party = ["moneymaker", "tests"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["alpaca.*", "apscheduler.*", "feedparser.*", "praw.*", "talipp.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=moneymaker --cov-report=term-missing --cov-fail-under=80 -q"

[tool.coverage.run]
branch = true
source = ["src/moneymaker"]
